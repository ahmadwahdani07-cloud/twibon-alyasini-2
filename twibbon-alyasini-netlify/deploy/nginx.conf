# Konfigurasi Nginx untuk Twibbon Pondok Pesantren Terpadu Al-Yasini
# Letakkan di /etc/nginx/sites-available/twibbon dan symlink ke /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name twibbon.alyasini.com; # Ganti dengan domain atau subdomain resmi pesantren Anda

    # Ukuran maksimal upload frame twibbon PNG
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
